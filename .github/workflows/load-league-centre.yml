name: Load League Centre
on:
  push:
    paths:
      - 'league-table-v27.js'
      - '.github/workflows/load-league-centre.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject league centre script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="league-table-v27.js?v=20261021-1"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('index.html has no </body> marker')
              s=s.replace(marker,tag+'\n'+marker,1)
              p.write_text(s,encoding='utf-8')
          else:
              print('League Centre already loaded')
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Load FC-inspired league centre in career mode'
          git push
