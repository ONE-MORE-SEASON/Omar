name: Load career controls

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add career controls script to index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="career-controls.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>', tag+'\n</body>', 1)
              else:
                  s += '\n'+tag+'\n'
              p.write_text(s,encoding='utf-8')
          PY

      - name: Commit injection
        run: |
          git config user.name "ONE-MORE-SEASON"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Load career save controls"
          git push
